[package]
name = "knocker-core"
version = "0.1.0"
edition = "2024"
description = "Shared Rust foundation for Knocker webhook inbox semantics."
license = "Apache-2.0"
publish = false

[lib]
name = "knocker_core"

[dependencies]
base64 = "0.22"
hmac = "0.12"
honker-core = "0.2.3"
rusqlite = { version = "0.39.0", features = ["functions", "hooks"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.13"
