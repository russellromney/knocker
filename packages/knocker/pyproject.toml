[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "knockerlite"
version = "0.1.0"
description = "Python-first inbound webhook inbox on SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
keywords = ["webhooks", "sqlite", "stripe", "inbox", "honker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://knocker.dev"
Documentation = "https://knocker.dev"
Repository = "https://github.com/russellromney/knocker"
Issues = "https://github.com/russellromney/knocker/issues"

[tool.maturin]
python-source = "python"
module-name = "knocker._knocker_native"
